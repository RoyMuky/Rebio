name: Compilar APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Crear proyecto Android (si no existe) e íconos
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Re-Bio.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Re-Bio-APK
          path: Re-Bio.apk

      - name: Publicar APK con enlace directo (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Re-Bio.apk \
            --title "Re-Bio APK (última versión)" \
            --notes "Prototipo de prueba de Re-Bio para Android 7 o superior. Descarga Re-Bio.apk en el teléfono e instálalo permitiendo apps desconocidas. Compilado del commit ${{ github.sha }}."
