html,body{height:100%}

.body{flex:1;overflow-y:auto;padding:16px;min-height:0;position:relative}

.link{background:none;border:0;color:var(--g);text-decoration:underline;font-size:14px;cursor:pointer;padding:6px}

.slot{aspect-ratio:1;border:1.5px dashed #a8a8ae;border-radius:10px;display:grid;place-items:center;font-size:26px;color:var(--mut);cursor:pointer;position:relative;overflow:hidden;background:#fff}

.msg.me{align-self:flex-end;background:#e4e4e8;border-color:#e4e4e8;border-bottom-right-radius:4px}
.msg.ot{align-self:flex-start;border-bottom-left-radius:4px}

.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.compose input{flex:1;border:1px solid #bfbfc4;border-radius:10px;padding:11px;font:inherit;font-size:15px}
.compose button{border:1px solid #bfbfc4;background:#fff;border-radius:10px;width:46px;font-size:18px;cursor:pointer}
.code{font-size:34px;font-weight:800;letter-spacing:10px;text-align:center;padding:10px;background:var(--gl);color:var(--g);border-radius:12px;margin-top:6px}
.bigstars{display:flex;justify-content:center;gap:10px;margin:16px 0}

.bigstars button.on{color:#c78a00}
.done{border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;margin-top:18px}
.done .e{font-size:44px}
.stat{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:16px}
.stat b{font-size:28px}
.drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;flex-direction:column}
.drawer{background:#fff;max-height:88%;overflow-y:auto;border-bottom-left-radius:16px;border-bottom-right-radius:16px}

.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff}

.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:14px;color:var(--mut)}
.radio{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}

.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.demo{font-size:12px;color:var(--mut);background:var(--bg);border-radius:10px;padding:10px;margin-top:18px}
</style>

function filterList(arr,mode,sort){
 let r=arr.filter(m=>!mode||mode==='todas'||(mode==='tienda'?m.product:(!m.product&&m.mode===mode)));
 r=sort==='precio'?r.sort((a,b)=>(a.mode==='venta'?a.price:-1)-(b.mode==='venta'?b.price:-1)):r.sort((a,b)=>b.created-a.created);
 return r;
}
function segHTML(cur,fn,extra){return `<div class="seg">${[['todas','Todas'],['venta','Venta'],['intercambio','Intercambio'],...(extra||[])].map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`}
SCREENS.cat=p=>{
 const mode=p.mode||'todas',sort=p.sort||'recientes';
 const base=active().filter(m=>p.cat==='all'||m.cat===p.cat);
 const list=filterList(base,mode,sort);
 return `${hBack(esc(cat(p.cat).n))}${segHTML(mode,'setCatMode')}
 <div class="bar">${list.length} resultado${list.length===1?'':'s'} · Ordenar: <select onchange="setCatSort(this.value)"><option value="recientes" ${sort==='recientes'?'selected':''}>Recientes</option><option value="precio" ${sort==='precio'?'selected':''}>Menor precio</option></select></div>
 <div class="body np">${list.length?list.map(rowItem).join(''):empty(cat(p.cat).i,'Aún no hay materiales con este filtro.',`<button class="btn" style="margin-top:16px" onclick="go('publish',{cat:'${p.cat==='all'?'':p.cat}'})">Publicar uno</button>`)}</div>`};

 return `<div class="kv"><span>Línea</span><span>${esc(m.line)}</span></div>

let PICK=null;
SCREENS.pickswap=p=>{
 const want=mat(p.id),mine=S.mats.filter(m=>m.owner==='me'&&m.status==='activa');
 return `${hBack('Proponer intercambio')}<div class="body">
 <p class="sm mut">Quieres: <b style="color:var(--ink)">${esc(want.title)}</b> de ${esc(user(want.owner).name)}${want.want?`. Busca a cambio: <i>${esc(want.want)}</i>`:''}.</p>
 <h3>¿Qué material ofreces?</h3>
 ${mine.length?mine.map(m=>`<div class="radio ${PICK===m.id?'on':''}" onclick="PICK='${m.id}';render(true)">${thumb(m)}<div style="flex:1"><b>${esc(m.title)}</b><div class="sm mut">${esc(m.cond)} · ${MODES[m.mode]}</div></div>${PICK===m.id?'✔':''}</div>`).join('')
  +`<button class="btn p" ${PICK&&mine.some(m=>m.id===PICK)?'':'disabled'} onclick="sendProp('${want.id}')">Enviar propuesta</button>`
  :empty('📦','No tienes publicaciones activas para ofrecer.',`<button class="btn p" style="margin-top:16px" onclick="go('publish',{mode:'intercambio'})">Publicar un material</button>`)}
 </div>`};
function sendProp(wantId){
 const want=mat(wantId),pr={id:uid('p'),from:'me',to:want.owner,offer:PICK,want:wantId,status:'pendiente',t:Date.now()};
 S.props.unshift(pr);PICK=null;replace('swaps',{tab:'enviadas'});toast('Propuesta enviada');
 setTimeout(()=>{if(pr.status==='pendiente'&&mat(pr.want)?.status==='activa'&&mat(pr.offer)?.status==='activa'){acceptProp(pr.id,true);notify(user(pr.to).name+' aceptó tu propuesta de intercambio',['swaps',{tab:'enviadas'}])}},6000);
}
function acceptProp(id,silent){
 const pr=S.props.find(p=>p.id===id),a=mat(pr.offer),b=mat(pr.want);
 if(a.status!=='activa'||b.status!=='activa'){pr.status='rechazada';render(true);return toast('Uno de los materiales ya no está disponible')}
 pr.status='aceptada';a.status=b.status='reservada';
 const other=pr.from==='me'?pr.to:pr.from;
 const tx={id:uid('t'),type:'intercambio',mats:[a.id,b.id],giver:'ambos',receiver:'ambos',other,status:'reservada',code:String(1000+Math.floor(Math.random()*9000)),t:Date.now(),rated:false,prop:pr.id};
 S.txs.unshift(tx);pr.tx=tx.id;
 const c=getChat(other,pr.from==='me'?pr.want:pr.offer);c.tx=tx.id;
 c.msgs.push({f:'sys',x:'Intercambio aceptado: '+a.title+' ⇄ '+b.title,t:Date.now()});
 if(!silent){render(true);toast('Intercambio aceptado. Coordina el retiro en el chat.')}
}
function rejectProp(id){const pr=S.props.find(p=>p.id===id);pr.status='rechazada';render(true);toast('Propuesta rechazada')}
function cancelProp(id){const pr=S.props.find(p=>p.id===id);pr.status='cancelada';render(true);toast('Propuesta cancelada')}

function slotInner(i){const s=DRAFT.photos[i];return s?`<img src="${s}" alt=""><button class="x" aria-label="Quitar foto" onclick="event.stopPropagation();rmPhoto(${i})">✕</button>`:'＋'}

function gotPhoto(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,560/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);DRAFT.photos[slotI]=cv.toDataURL('image/jpeg',.6);refreshSlots()};im.src=r.result};r.readAsDataURL(f)}

  S.dons.unshift(dn);DRAFT={photos:[]};NAV=[{s:'home',p:{}},{s:'donaciones',p:{tab:'mias'}}];go('don',{id:dn.id});toast('Donación registrada. Llévala al centro '+centro(dn.centro).n);return}
 const m={id:uid('m'),owner:'me',status:'activa',created:Date.now(),icon:cat(data.cat).i,...data};

 <div style="height:12px"></div></div>`};

SCREENS.swaps=p=>{
 const tab=p.tab||'recibidas';
 const L=tab==='recibidas'?S.props.filter(x=>x.to==='me'&&x.status!=='completada'):tab==='enviadas'?S.props.filter(x=>x.from==='me'&&x.status!=='completada'):S.props.filter(x=>x.status==='completada'&&(x.to==='me'||x.from==='me'));
 const card=pr=>{
  const mineId=pr.from==='me'?pr.offer:pr.want,theirId=pr.from==='me'?pr.want:pr.offer,mi=mat(mineId),su=mat(theirId),other=user(pr.from==='me'?pr.to:pr.from);
  if(!mi||!su)return '';
  const tx=S.txs.find(t=>t.id===pr.tx);
  const st={pendiente:'<span class="tag">Pendiente</span>',aceptada:'<span class="tag res">Aceptada · por entregar</span>',rechazada:'<span class="tag" style="color:var(--bad)">Rechazada</span>',cancelada:'<span class="tag">Cancelada</span>',completada:'<span class="tag don">Completada</span>'}[pr.status];
  let acts='';
  if(pr.status==='pendiente')acts=pr.to==='me'?`<div class="acts"><button class="btn p" onclick="acceptProp('${pr.id}')">Aceptar</button><button class="btn" onclick="rejectProp('${pr.id}')">Rechazar</button></div>`:`<div class="acts"><button class="btn" onclick="cancelProp('${pr.id}')">Cancelar propuesta</button></div>`;
  if(pr.status==='aceptada'&&tx)acts=`<div class="acts"><button class="btn" onclick="openChat('${other.id}','${theirId}')">Chat</button><button class="btn p" onclick="go('retiro',{tx:'${tx.id}'})">Coordinar retiro</button></div>`;
  if(pr.status==='completada'&&tx&&!tx.rated)acts=`<div class="acts"><button class="btn p" onclick="go('rate',{tx:'${tx.id}'})">Calificar experiencia</button></div>`;
  return `<div class="swap"><div class="who">${pr.from==='me'?'Para':'De'} <b style="color:var(--ink)">${esc(other.name)}</b> · ${dm(pr.t)} ${st}</div>
  <div class="pair"><div class="side" onclick="go('detail',{id:'${mi.id}'})"><div class="h">Mi material</div>${thumb(mi)}<div class="t">${esc(mi.title)}</div></div><div class="arrow">⇄</div><div class="side" onclick="go('detail',{id:'${su.id}'})"><div class="h">Su material</div>${thumb(su)}<div class="t">${esc(su.title)}</div></div></div>${acts}</div>`};
 return `${hBack('Mis intercambios')}<div class="seg">${[['recibidas','Recibidas'],['enviadas','Enviadas'],['completadas','Completadas']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="NAV[NAV.length-1].p.tab='${k}';render()">${l}</button>`).join('')}</div>
 <div class="body">${L.length?L.map(card).join(''):empty('⇄',tab==='recibidas'?'No tienes propuestas recibidas.':tab==='enviadas'?'Aún no has enviado propuestas. Busca un material en modalidad Intercambio.':'Todavía no completas intercambios.')}</div>`};

SCREENS.retiro=p=>{

 return `${hBack('Retiro en acopio')}<div class="body">

 <div class="vk"><div>Horario</div>${c.h}</div>
 ${tx.status==='reservada'?`<h3>Confirmar la entrega</h3>
 <p class="sm mut">En el centro, quien recibe dicta este código a quien entrega. Ingresarlo confirma la entrega para ambas partes.</p>
 <div class="code">${tx.code}</div>
 ${field('code','Código de entrega','<input class="in" id="code" inputmode="numeric" maxlength="4" placeholder="0000">')}
 <button class="btn p" onclick="confirmDelivery('${tx.id}')">Confirmar entrega</button>
 <button class="btn" onclick="cancelTx('${tx.id}')">Cancelar reserva</button>`:`<div class="note">Entrega confirmada el ${dm(tx.done||tx.t)}.</div>${!tx.rated?`<button class="btn p" onclick="go('rate',{tx:'${tx.id}'})">Calificar experiencia</button>`:''}`}</div>`};
function confirmDelivery(id){
 const tx=S.txs.find(t=>t.id===id);
 if(!setErr('code',val('code').trim()===tx.code?'':'El código no coincide'))return;
 tx.status='entregada';tx.done=Date.now();
 const kg=tx.mats.map(mat).filter(Boolean).reduce((a,m)=>{if(!m.product)m.status='entregada';return a+m.kg},0);
 tx.kg=kg;S.users.me.kg+=kg;S.users[tx.other].kg+=kg;
 if(tx.prop){const pr=S.props.find(p=>p.id===tx.prop);if(pr)pr.status='completada'}
 const c=S.chats.find(x=>x.tx===id);if(c)c.msgs.push({f:'sys',x:'Entrega confirmada en el centro de acopio.',t:Date.now()});
 replace('rate',{tx:id});
}
function cancelTx(id){
 const tx=S.txs.find(t=>t.id===id);tx.status='cancelada';tx.mats.map(mat).filter(Boolean).forEach(m=>{if(m.product)m.qty+=1;else m.status='activa'});
 if(tx.prop){const pr=S.props.find(p=>p.id===tx.prop);if(pr)pr.status='cancelada'}
 const c=S.chats.find(x=>x.tx===id);if(c){c.msgs.push({f:'sys',x:'Reserva cancelada. El material vuelve a estar disponible.',t:Date.now()});c.tx=null}
 back();toast('Reserva cancelada');
}

/* N8 Configuración */
SCREENS.settings=()=>{const u=S.users.me;return `${hBack('Configuración')}<div class="body">
 ${field('s-name','Nombre',`<input class="in" id="s-name" value="${esc(u.name)}">`)}
 ${field('s-car','Carrera',`<select class="in" id="s-car">${carreraOptions(u.carrera)}</select>`)}
 <div class="kv"><span>Correo</span><span>${esc(u.email||S.session||'')}</span></div>
 <button class="btn p" onclick="saveSettings()">Guardar cambios</button>
 <h3>Notificaciones</h3>
 <label class="toggle">Propuestas y mensajes <input type="checkbox" checked></label>
 <label class="toggle">Novedades de mis categorías <input type="checkbox"></label>
 <h3>Sesión y datos</h3>
 <button class="btn" onclick="logout()">Cerrar sesión</button>
 <button class="btn d" onclick="if(confirmInline('reset')){localStorage.removeItem(KEY);S=seed();reset('login');toast('Datos de prueba restablecidos')}">Restablecer datos de prueba</button>
 <p class="xs mut center" style="margin-top:16px">Re-Bio · prototipo v0.1 · Comunidad ESPOL</p></div>`};
function saveSettings(){const u=S.users.me;u.name=val('s-name').trim()||u.name;u.carrera=val('s-car');if(S.accounts[S.session])Object.assign(S.accounts[S.session],{name:u.name,carrera:u.carrera});back();toast('Perfil actualizado')}

/* N7 Notificaciones */
SCREENS.notifs=()=>{const html=`${hBack('Notificaciones')}<div class="body np">${S.notifs.length?S.notifs.map((n,i)=>`<div class="li" onclick="openNotif(${i})" style="${n.r?'':'background:var(--gl)'}"><div class="mid"><div style="font-size:14px">${esc(n.x)}</div><div class="s">${dm(n.t)} ${hm(n.t)}</div></div><span class="chev">›</span></div>`).join(''):empty('🔔','No tienes notificaciones.')}</div>`;setTimeout(()=>{S.notifs.forEach(n=>n.r=true);save()},0);return html};
function openNotif(i){const n=S.notifs[i];if(n.go)go(n.go[0],n.go[1])}

/* N9 Reportar */
SCREENS.report=p=>`${hBack('Reportar publicación')}<div class="body"><p class="sm mut">¿Qué problema tiene “${esc(mat(p.id).title)}”?</p>
 ${['Información falsa o engañosa','Material prohibido o peligroso','Precio abusivo','Spam o publicación repetida','Otro motivo'].map((r,i)=>`<label class="radio"><input type="radio" name="rep" value="${i}"> ${r}</label>`).join('')}
 ${field('rep-txt','Detalles (opcional)','<textarea class="in" id="rep-txt" maxlength="300"></textarea>')}
 <button class="btn p" onclick="if(!document.querySelector('[name=rep]:checked'))return toast('Elige un motivo');back();toast('Reporte enviado. Lo revisaremos pronto.')">Enviar reporte</button></div>`;

/* Guardas: pantallas que requieren sesión */
const PUBLIC=['splash','login','register','forgot','verify'];
const _render=render;
render=function(k){const cur=NAV[NAV.length-1];if(!S.session&&!PUBLIC.includes(cur.s)){NAV=[{s:'login',p:{}}]}_render(k)};
render();
/* Botón Atrás de Android (solo dentro de la app instalada) */
try{const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(A)A.addListener('backButton',()=>{if(document.querySelector('.drawer-bg'))closeMenu();else if(NAV.length>1)back();else A.exitApp()})}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
